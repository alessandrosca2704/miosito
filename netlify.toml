[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  CI = "false"


[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/bustapaga"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/bustapaga/*"
  [headers.values]
    Cache-Control = "no-store"

