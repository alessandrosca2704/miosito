[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  CI = "false"


[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/bustapaga"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/bustapaga/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/bustapaga.html"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex"


# Keep the explicit extensionless routes and canonical URLs stable.
[build.processing.html]
  pretty_urls = false
